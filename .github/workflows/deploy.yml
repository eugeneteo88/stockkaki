name: Build & deploy StockKaki

# Two kinds of runs:
#  - push / manual  → FAST build: fresh SGX prices, but reuse the cached Yahoo news+fundamentals (SKIP_YAHOO=1). ~2 min.
#  - scheduled      → FULL data refresh (Yahoo dividends/news/fundamentals) + re-commit the cache.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'     # 00:30 UTC = 08:30 SGT, daily     — morning news/fundamentals refresh (incl. weekends)
    - cron: '30 10 * * 1-5'  # 10:30 UTC = 18:30 SGT, Mon–Fri   — after SGX close: capture the day's closing prices
  workflow_dispatch:
    inputs:
      alerts_test:
        description: 'Send a SAMPLE ex-date reminder to this email (blank = normal run)'
        required: false
      alerts_dry:
        description: 'Dry-run alerts (log only, no emails sent)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        # push = fast build from cache (SGX prices still fetched fresh); schedule/manual = full Yahoo fetch.
        env:
          SKIP_YAHOO: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node build.mjs
      - name: Persist last-good data cache (news + dividends + fundamentals)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/yahoo-cache.json 2>/dev/null || true
          git commit -m "chore: update last-good data cache [skip ci]" || echo "no cache change"
          git push || echo "push skipped"
      - name: Keyword radar (Google Autocomplete → /keywords/)
        if: github.event_name != 'push'
        run: node keywords.mjs || true
      - name: Send ex-date alerts
        if: github.event_name != 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_TEST: ${{ github.event.inputs.alerts_test }}
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (github.event.inputs.alerts_dry == 'false' && '0' || '1') }}
        run: node send-alerts.mjs
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: stockkaki.com
          force_orphan: true
