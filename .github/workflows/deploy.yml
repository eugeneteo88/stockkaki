name: Build & deploy StockKaki

# Two kinds of runs:
#  - push / manual  → FAST build: fresh SGX prices, but reuse the cached Yahoo news+fundamentals (SKIP_YAHOO=1). ~2 min.
#  - scheduled      → FULL data refresh (Yahoo dividends/news/fundamentals) + re-commit the cache.
on:
  push:
    branches: [main]
  schedule:
    # Every ~4h so news (incl. the general Singapore-market feed) stays fresh through the day.
    # GitHub cron is best-effort and can run 1–3h late, so the spread also absorbs those delays.
    # Morning is deliberately redundant (4 slots 07:00–09:00 SGT): if GitHub throttles one,
    # another usually fires near time so the morning news is fresh. Builds are idempotent.
    - cron: '0 23 * * *'    # 07:00 SGT — morning (early)
    - cron: '0 0 * * *'     # 08:00 SGT — morning
    - cron: '30 0 * * *'    # 08:30 SGT — morning
    - cron: '0 1 * * *'     # 09:00 SGT — morning (late)
    - cron: '30 4 * * *'    # 12:30 SGT — midday
    - cron: '30 8 * * *'    # 16:30 SGT — before SGX close
    - cron: '30 10 * * 1-5' # 18:30 SGT (Mon–Fri) — after SGX close: capture closing prices
    - cron: '30 13 * * *'   # 21:30 SGT — evening (post-close news + US pre-market)
  workflow_dispatch:
    inputs:
      alerts_test:
        description: 'Send a SAMPLE ex-date reminder to this email (blank = normal run)'
        required: false
      alerts_dry:
        description: 'Dry-run alerts (log only, no emails sent)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        # push = fast build from cache (SGX prices still fetched fresh); schedule/manual = full Yahoo fetch.
        env:
          SKIP_YAHOO: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node build.mjs
      - name: Keyword radar (Google Autocomplete → /keywords/)
        if: github.event_name != 'push'
        run: node keywords.mjs || true
      - name: Send ex-date alerts
        if: github.event_name != 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_TEST: ${{ github.event.inputs.alerts_test }}
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (github.event.inputs.alerts_dry == 'false' && '0' || '1') }}
        run: node send-alerts.mjs
      - name: Persist data (last-good cache + alert snapshot)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ 2>/dev/null || true
          git commit -m "chore: update data snapshot [skip ci]" || echo "no data change"
          git push || echo "push skipped"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: stockkaki.com
          force_orphan: true
