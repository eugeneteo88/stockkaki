name: Build & deploy StockKaki

# Rebuilds the site from live SGX data and deploys — on push, daily, or manually.
on:
  push:
    branches: [main]
  schedule:
    - cron: '10 22 * * *'   # 22:10 UTC = 06:10 Singapore, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (fetch SGX + generate site)
        run: node build.mjs
      - name: Persist last-good data cache (news + dividends + fundamentals)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/yahoo-cache.json 2>/dev/null || true
          git commit -m "chore: update last-good data cache [skip ci]" || echo "no cache change"
          git push || echo "push skipped"
      - name: Keyword radar (Google Autocomplete → /keywords/)
        run: node keywords.mjs || true
      - name: Send weekly dividend alerts (Mondays)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node send-alerts.mjs
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: stockkaki.com
          force_orphan: true
